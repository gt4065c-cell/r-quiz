<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>R 문제은행 퀴즈 · ADsP / 빅데이터분석기사</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f6fb; --card:#ffffff; --ink:#1b2333; --muted:#6b7488; --line:#e3e7ef;
    --brand:#3056d3; --brand-soft:#e8eeff; --ok:#1a9b5b; --ok-soft:#e5f6ed;
    --bad:#d6364a; --bad-soft:#fde9ec; --code:#0f1729; --code-ink:#e6edf7;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;line-height:1.6}
  .wrap{max-width:760px;margin:0 auto;padding:24px 16px 60px}
  header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
  .logo{font-weight:900;font-size:18px;letter-spacing:-.3px}
  .logo span{color:var(--brand)}
  .who{font-size:13px;color:var(--muted);text-align:right}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:0 6px 24px rgba(20,30,60,.05)}
  h1{font-size:26px;margin:0 0 6px;letter-spacing:-.5px}
  p.sub{margin:0 0 22px;color:var(--muted)}
  label{display:block;font-weight:700;font-size:14px;margin:14px 0 6px}
  input[type=text]{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;font-size:16px;font-family:inherit}
  input[type=text]:focus{outline:none;border-color:var(--brand)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:14px 22px;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;background:var(--brand);color:#fff;transition:transform .05s, opacity .2s}
  .btn:active{transform:scale(.98)}
  .btn:disabled{opacity:.35;cursor:not-allowed}
  .btn.ghost{background:var(--brand-soft);color:var(--brand)}
  .btn.full{width:100%;margin-top:22px}
  .err{color:var(--bad);font-size:14px;margin-top:10px;min-height:20px}
  .rules{background:var(--brand-soft);border-radius:12px;padding:14px 16px;font-size:14px;margin-top:18px}
  .rules li{margin:2px 0}

  /* progress */
  .prog{display:flex;align-items:center;gap:12px;margin-bottom:16px}
  .bar{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .3s}
  .count{font-weight:700;font-size:14px;white-space:nowrap}
  .score-pill{font-size:13px;font-weight:700;background:var(--ok-soft);color:var(--ok);padding:4px 10px;border-radius:99px;white-space:nowrap}

  .meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .tag{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:#eef1f6;color:var(--muted)}
  .tag.exam{background:var(--brand-soft);color:var(--brand)}
  .qtext{font-size:18px;font-weight:700;margin:4px 0 14px;white-space:pre-wrap;word-break:keep-all}
  pre.code{background:var(--code);color:var(--code-ink);font-family:'JetBrains Mono',monospace;font-size:14px;padding:14px 16px;border-radius:12px;overflow-x:auto;margin:0 0 16px;line-height:1.55}
  code.inl{font-family:'JetBrains Mono',monospace;background:#eef1f6;padding:1px 6px;border-radius:6px;font-size:.92em}

  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:14px 16px;border:1.5px solid var(--line);border-radius:14px;background:#fff;font-size:15.5px;font-family:inherit;color:var(--ink);cursor:pointer;transition:border-color .15s, background .15s}
  .opt:hover:not(:disabled){border-color:#b9c6ef}
  .opt .no{flex:none;width:26px;height:26px;border-radius:50%;background:#eef1f6;display:grid;place-items:center;font-weight:700;font-size:13px}
  .opt .tx{padding-top:1px;word-break:break-word}
  .opt.sel{border-color:var(--brand);background:var(--brand-soft)}
  .opt.sel .no{background:var(--brand);color:#fff}
  .opt.correct{border-color:var(--ok);background:var(--ok-soft)}
  .opt.correct .no{background:var(--ok);color:#fff}
  .opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
  .opt.wrong .no{background:var(--bad);color:#fff}
  .opt:disabled{cursor:default}

  .explain{margin-top:18px;border-radius:14px;padding:16px 18px;display:none}
  .explain.show{display:block;animation:pop .25s ease}
  .explain.ok{background:var(--ok-soft);border:1px solid #bfe6d0}
  .explain.bad{background:var(--bad-soft);border:1px solid #f5c5cc}
  .explain h3{margin:0 0 6px;font-size:17px}
  .explain.ok h3{color:var(--ok)} .explain.bad h3{color:var(--bad)}
  .explain p{margin:0;font-size:15px}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .actions{display:flex;justify-content:flex-end;margin-top:20px}

  /* result */
  .big{font-size:56px;font-weight:900;color:var(--brand);line-height:1;margin:8px 0}
  .big small{font-size:22px;color:var(--muted);font-weight:700}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}
  .stat{background:#f7f9fc;border-radius:12px;padding:12px;text-align:center}
  .stat b{display:block;font-size:22px}
  .stat span{font-size:12px;color:var(--muted)}
  .review{margin-top:24px}
  .review h2{font-size:18px;margin:0 0 10px}
  .ritem{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;font-size:14.5px}
  .ritem .rq{font-weight:700;margin-bottom:6px;white-space:pre-wrap}
  .ritem .ra{color:var(--bad)} .ritem .rc{color:var(--ok);font-weight:700}
  .ritem .rx{color:var(--muted);margin-top:4px}
  .saved{font-size:13px;color:var(--muted);margin-top:8px}
  .hidden{display:none!important}
  @media (max-width:520px){ .card{padding:20px} h1{font-size:22px} .qtext{font-size:16.5px} .big{font-size:46px} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo">R <span>문제은행</span> 퀴즈</div>
    <div class="who" id="who"></div>
  </header>

  <!-- 1. 입장 화면 -->
  <section class="card" id="scrLogin">
    <h1>ADsP · 빅데이터분석기사 R 퀴즈</h1>
    <p class="sub">100문제 문제은행에서 무작위로 <b>20문제</b>가 출제됩니다.</p>
    <label for="inName">이름</label>
    <input type="text" id="inName" placeholder="예) 홍길동" autocomplete="name">
    <label for="inId">학번</label>
    <input type="text" id="inId" placeholder="예) 202612345" inputmode="numeric">
    <div class="err" id="loginErr"></div>
    <ul class="rules">
      <li>한 문제씩 풀고 <b>정답 확인</b>을 누르면 해설이 나옵니다.</li>
      <li>정답을 확인한 뒤에는 답을 바꿀 수 없어요.</li>
      <li>보기 순서도 사람마다 무작위로 섞여 나옵니다.</li>
    </ul>
    <button class="btn full" id="btnStart">시작하기 →</button>
  </section>

  <!-- 2. 문제 화면 -->
  <section class="card hidden" id="scrQuiz">
    <div class="prog">
      <span class="count" id="qCount">1 / 20</span>
      <div class="bar"><i id="qBar"></i></div>
      <span class="score-pill" id="qScore">정답 0</span>
    </div>
    <div class="meta" id="qMeta"></div>
    <div class="qtext" id="qText"></div>
    <div id="qCode"></div>
    <div class="opts" id="qOpts"></div>
    <div class="explain" id="qExplain"></div>
    <div class="actions">
      <button class="btn" id="btnCheck" disabled>정답 확인</button>
      <button class="btn hidden" id="btnNext">다음 문제 →</button>
    </div>
  </section>

  <!-- 3. 결과 화면 -->
  <section class="card hidden" id="scrResult">
    <p class="sub" style="margin-bottom:0" id="rName"></p>
    <div class="big" id="rScore">0<small> / 20</small></div>
    <div class="stats">
      <div class="stat"><b id="rPct">0점</b><span>100점 환산</span></div>
      <div class="stat"><b id="rOk" style="color:var(--ok)">0</b><span>맞은 문제</span></div>
      <div class="stat"><b id="rNg" style="color:var(--bad)">0</b><span>틀린 문제</span></div>
    </div>
    <div class="saved" id="rSaved">결과 저장 중…</div>
    <div class="review" id="rReview"></div>
    <button class="btn ghost full" id="btnRetry">새로운 20문제로 다시 풀기</button>
  </section>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="questions.js"></script>
<script>
/* ============ Firebase 설정 ============ */
const firebaseConfig = {
  apiKey: "AIzaSyAp_iI1mhnIWMebdzXUu2gE21aW9TMD2sg",
  authDomain: "bbb-game-d6047.firebaseapp.com",
  databaseURL: "https://bbb-game-d6047-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "bbb-game-d6047",
  storageBucket: "bbb-game-d6047.firebasestorage.app",
  messagingSenderId: "183746574206",
  appId: "1:183746574206:web:62690fa29fb2024a26652f"
};
const DB_ROOT = "adsp_r_quiz";      // DB 안에서 이 퀴즈가 쓰는 폴더 이름
const NUM_Q = 20;                   // 출제 문항 수

let db = null;
try { firebase.initializeApp(firebaseConfig); db = firebase.database(); }
catch(e){ console.warn("Firebase 초기화 실패", e); }

/* ============ 상태 ============ */
const S = { name:"", sid:"", attemptId:null, list:[], idx:0, picked:null, checked:false, answers:[], score:0, startedAt:0 };
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inl = s => esc(s).replace(/`([^`]+)`/g, '<code class="inl">$1</code>');
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; };
const safeKey = s => s.replace(/[.#$\[\]\/]/g, "_");
function show(id){ ["scrLogin","scrQuiz","scrResult"].forEach(x => $(x).classList.toggle("hidden", x!==id)); window.scrollTo(0,0); }

/* ============ 새로고침 대비 저장 (브라우저에만) ============ */
function saveLocal(){ try{ localStorage.setItem("adspQuizState", JSON.stringify(S)); }catch(e){} }
function clearLocal(){ try{ localStorage.removeItem("adspQuizState"); }catch(e){} }
function loadLocal(){ try{ return JSON.parse(localStorage.getItem("adspQuizState")||"null"); }catch(e){ return null; } }

/* ============ 시작 ============ */
$("btnStart").onclick = startQuiz;
$("inId").addEventListener("keydown", e => { if(e.key==="Enter") startQuiz(); });

function startQuiz(){
  const name = $("inName").value.trim(), sid = $("inId").value.trim();
  if(!name){ $("loginErr").textContent = "이름을 입력해 주세요."; return; }
  if(!/^[0-9A-Za-z-]{4,20}$/.test(sid)){ $("loginErr").textContent = "학번을 정확히 입력해 주세요 (숫자 4자리 이상)."; return; }
  $("loginErr").textContent = "";

  S.name = name; S.sid = sid; S.idx = 0; S.picked = null; S.checked = false;
  S.answers = []; S.score = 0; S.startedAt = Date.now();
  // 100문제 중 20개 무작위 + 보기 순서도 섞기
  S.list = shuffle(QUESTION_BANK).slice(0, NUM_Q).map(q => ({ id:q.id, order: shuffle([0,1,2,3]) }));
  S.attemptId = null;

  if(db){
    const ref = db.ref(`${DB_ROOT}/attempts`).push();
    S.attemptId = ref.key;
    ref.set({ name, studentId:sid, total:NUM_Q, score:0, answered:0, finished:false,
              questionIds:S.list.map(x=>x.id), startedAt: firebase.database.ServerValue.TIMESTAMP })
       .catch(err => console.warn("DB 저장 실패", err));
  }
  saveLocal();
  $("who").innerHTML = `${esc(name)}<br>${esc(sid)}`;
  show("scrQuiz"); renderQ();
}

/* ============ 문제 표시 ============ */
function bankQ(id){ return QUESTION_BANK.find(q => q.id===id); }

function renderQ(){
  const item = S.list[S.idx], q = bankQ(item.id);
  S.picked = null; S.checked = false;
  $("qCount").textContent = `${S.idx+1} / ${NUM_Q}`;
  $("qBar").style.width = `${(S.idx)/NUM_Q*100}%`;
  $("qScore").textContent = `정답 ${S.score}`;
  $("qMeta").innerHTML = `<span class="tag exam">${esc(q.exam)}</span><span class="tag">${esc(q.topic)}</span>`;

  // 문제 본문 / 코드 분리 (빈 줄 뒤는 R 코드)
  const parts = q.q.split(/\n\s*\n/);
  $("qText").innerHTML = `Q${S.idx+1}. ` + inl(parts[0]);
  $("qCode").innerHTML = parts.length>1 ? `<pre class="code">${esc(parts.slice(1).join("\n\n"))}</pre>` : "";

  $("qOpts").innerHTML = item.order.map((oi, k) =>
    `<button class="opt" data-k="${k}"><span class="no">${k+1}</span><span class="tx">${inl(q.opts[oi])}</span></button>`).join("");
  document.querySelectorAll(".opt").forEach(b => b.onclick = () => pick(+b.dataset.k));

  $("qExplain").className = "explain"; $("qExplain").innerHTML = "";
  $("btnCheck").classList.remove("hidden"); $("btnCheck").disabled = true;
  $("btnNext").classList.add("hidden");
}

function pick(k){
  if(S.checked) return;
  S.picked = k;
  document.querySelectorAll(".opt").forEach(b => b.classList.toggle("sel", +b.dataset.k===k));
  $("btnCheck").disabled = false;
}

/* ============ 정답 확인 ============ */
$("btnCheck").onclick = () => {
  if(S.picked===null || S.checked) return;
  S.checked = true;
  const item = S.list[S.idx], q = bankQ(item.id);
  const correctK = item.order.indexOf(q.ans-1);           // 화면상 정답 위치
  const pickedOrig = item.order[S.picked] + 1;             // 원래 보기 번호(1~4)
  const ok = S.picked === correctK;
  if(ok) S.score++;
  S.answers.push({ id:q.id, picked:pickedOrig, correct:q.ans, ok });

  document.querySelectorAll(".opt").forEach(b => {
    const k = +b.dataset.k; b.disabled = true; b.classList.remove("sel");
    if(k===correctK) b.classList.add("correct");
    else if(k===S.picked) b.classList.add("wrong");
  });
  const ex = $("qExplain");
  ex.className = "explain show " + (ok ? "ok" : "bad");
  ex.innerHTML = `<h3>${ok ? "⭕ 정답입니다!" : `❌ 아쉬워요! 정답은 ${correctK+1}번`}</h3><p>${inl(q.exp)}</p>`;
  $("qScore").textContent = `정답 ${S.score}`;
  $("qBar").style.width = `${(S.idx+1)/NUM_Q*100}%`;

  $("btnCheck").classList.add("hidden");
  $("btnNext").classList.remove("hidden");
  $("btnNext").textContent = S.idx+1 < NUM_Q ? "다음 문제 →" : "결과 보기 🎉";

  if(db && S.attemptId){
    db.ref(`${DB_ROOT}/attempts/${S.attemptId}`).update({
      [`answers/${S.idx}`]: { qid:q.id, picked:pickedOrig, correct:q.ans, ok },
      score:S.score, answered:S.answers.length
    }).catch(err => console.warn(err));
  }
  saveLocal();
};

$("btnNext").onclick = () => {
  if(S.idx+1 < NUM_Q){ S.idx++; saveLocal(); renderQ(); }
  else finish();
};

/* ============ 결과 ============ */
function finish(){
  const pct = Math.round(S.score/NUM_Q*100);
  $("rName").textContent = `${S.name} (${S.sid}) 님의 결과`;
  $("rScore").innerHTML = `${S.score}<small> / ${NUM_Q}</small>`;
  $("rPct").textContent = `${pct}점`;
  $("rOk").textContent = S.score;
  $("rNg").textContent = NUM_Q - S.score;

  const wrong = S.answers.filter(a => !a.ok);
  $("rReview").innerHTML = wrong.length === 0
    ? `<h2>🏆 만점! 모든 문제를 맞혔어요.</h2>`
    : `<h2>📌 틀린 문제 다시 보기 (${wrong.length})</h2>` + wrong.map(a => {
        const q = bankQ(a.id);
        return `<div class="ritem"><div class="rq">${inl(q.q)}</div>
          <div class="ra">내 답: ${inl(q.opts[a.picked-1])}</div>
          <div class="rc">정답: ${inl(q.opts[a.correct-1])}</div>
          <div class="rx">${inl(q.exp)}</div></div>`;
      }).join("");

  if(db && S.attemptId){
    const rec = { name:S.name, studentId:S.sid, score:S.score, total:NUM_Q, percent:pct,
                  finished:true, finishedAt: firebase.database.ServerValue.TIMESTAMP,
                  durationSec: Math.round((Date.now()-S.startedAt)/1000) };
    Promise.all([
      db.ref(`${DB_ROOT}/attempts/${S.attemptId}`).update(rec),
      db.ref(`${DB_ROOT}/students/${safeKey(S.sid)}/${S.attemptId}`).set({ name:S.name, score:S.score, percent:pct, finishedAt: firebase.database.ServerValue.TIMESTAMP })
    ]).then(() => $("rSaved").textContent = "✅ 결과가 저장되었습니다.")
      .catch(() => $("rSaved").textContent = "⚠️ 결과 저장에 실패했어요. 화면을 캡처해 교수님께 제출하세요.");
  } else {
    $("rSaved").textContent = "⚠️ 서버에 연결되지 않아 결과가 저장되지 않았어요. 화면을 캡처해 두세요.";
  }
  clearLocal();
  show("scrResult");
}

$("btnRetry").onclick = () => {
  $("inName").value = S.name; $("inId").value = S.sid; startQuiz();
};

/* ============ 새로고침해도 이어풀기 ============ */
(function resume(){
  const saved = loadLocal();
  if(!saved || !saved.list || !saved.list.length) return;
  Object.assign(S, saved);
  $("who").innerHTML = `${esc(S.name)}<br>${esc(S.sid)}`;
  show("scrQuiz");
  if(S.checked){ S.idx+1 < NUM_Q ? (S.idx++, renderQ()) : finish(); }
  else renderQ();
})();
</script>
</body>
</html>
